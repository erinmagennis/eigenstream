<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentra Streaming App</title>
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gradient);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .status {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-indicator.connecting {
            background: #fbbf24;
        }

        .status-indicator.connected {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .status-indicator.error {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .info {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 10px;
        }

        .button {
            background: white;
            color: var(--primary-color);
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 5px;
        }

        .button:hover {
            opacity: 0.9;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span id="appIcon">📹</span> <span id="appName">Streaming App</span></h1>
        <p class="subtitle" id="appSubtitle">POV Video Streaming</p>

        <div class="status">
            <div>
                <span class="status-indicator connecting" id="statusIndicator"></span>
                <span id="statusText">Initializing...</span>
            </div>
            <div class="info" id="infoText">Connecting to camera</div>
        </div>

        <div>
            <button class="button" id="startBtn" onclick="startStream()" disabled>Start Stream</button>
            <button class="button" id="stopBtn" onclick="stopStream()" disabled>Stop Stream</button>
        </div>

        <div class="error-message" id="errorMessage" style="display: none;"></div>

        <div class="info" style="margin-top: 30px;">
            <div>Backend: <span id="backendHost">Loading...</span></div>
            <div id="dashboardLink" style="margin-top: 5px; font-size: 12px; opacity: 0.6;">
                Dashboard: <a id="dashboardUrl" href="#" style="color: white;">View Live</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mentra/sdk@2.1.27/dist/index.js"></script>
    <script src="app.js"></script>
</body>
</html>
